name: Verify operations offline and games
on:
  push:
    branches: [feat/operations-offline-play-20260906]
permissions:
  contents: write
concurrency:
  group: operations-source-prepare
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified exact source
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          root=Path.cwd().resolve()
          chunks=[(root/f'.maintenance/ops.{i}').read_text().strip() for i in range(4)]
          chunks[3]=chunks[3].replace('g9+e41Oz','g9+41Oz').replace('YtvVpcKA','YtvVvpcKA')
          raw=gzip.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='c728d64c01e343e46464314186193644c231d48fca28d25d5264b187566f6ff0','Manifest mismatch'
          outputs={}
          for e in json.loads(raw):
              name=e['path']; p=(root/name).resolve()
              assert p.is_relative_to(root) and '.git' not in p.parts and '.github' not in p.parts and name not in outputs
              before=p.read_bytes() if p.exists() else b''
              actual=hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest() if p.exists() else None
              assert actual==e['base'],f'Base changed: {name}'
              lines=before.decode().splitlines(keepends=True); previous=len(lines)+1
              for a,b,text in reversed(e['ops']):
                  assert 0<=a<=b<=len(lines) and b<=previous
                  lines[a:b]=text.splitlines(keepends=True);previous=a
              after=''.join(lines).encode();assert hashlib.sha256(after).hexdigest()==e['sha256'],f'Output changed: {name}'
              outputs[name]=after
          for name,after in outputs.items():
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after)
          print('Applied',len(outputs),'verified application files.')
          PY
          python3 .maintenance/ops.followup.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and regressions
        run: |
          mkdir -p smoke-results
          for file in functions/*.js web/*offline*.js tools/prepare-offline.cjs tools/operations-*.cjs tools/offline-browser-check.cjs; do node --check "$file"; done
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/app.js')"
          node --test tests/*.test.cjs | tee smoke-results/node-tests.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test task roles warehouse atomic history and complete private games
        run: |
          npm install --prefix /tmp/sauna-rules --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing
          NODE_PATH=/tmp/sauna-rules/node_modules /tmp/sauna-rules/node_modules/.bin/firebase emulators:exec --project demo-sauna-team --only firestore,storage 'NODE_PATH=/tmp/sauna-rules/node_modules node --test tools/security.test.cjs tools/people-security.test.cjs tools/social-security.test.cjs tools/operations-security.test.cjs' | tee smoke-results/security-tests.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze every source file without suppressing errors
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings >smoke-results/analyzer.txt 2>&1
      - name: Verify real role views and local games
        run: flutter test test/release_navigation_test.dart test/team_workflows_test.dart test/people_release_test.dart test/social_audio_test.dart test/operations_release_test.dart | tee smoke-results/flutter-tests.txt
      - name: Build the existing branded web application
        run: |
          flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
          node tools/prepare-offline.cjs
      - name: Verify browser guide audio and airplane-mode public shell
        run: |
          npm install --prefix /tmp/sauna-browser --no-audit --no-fund playwright
          python3 -m http.server 8177 --directory build/web >/tmp/sauna-http.log 2>&1 &
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/team-browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/people-browser-check.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/social-audio-browser.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/offline-browser-check.cjs
      - name: Build Android with the existing internal development signature
        run: |
          flutter build apk --release --build-name=3.1.0 --build-number=$((31000+GITHUB_RUN_NUMBER)) >smoke-results/android-build.txt 2>&1
          cp build/app/outputs/flutter-apk/app-release.apk Sauna-Stilo-3.1.0-Android.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGNER="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --verbose --print-certs Sauna-Stilo-3.1.0-Android.apk >smoke-results/android-signature.txt
          AAPT="$(find "$SDK/build-tools" -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging Sauna-Stilo-3.1.0-Android.apk >smoke-results/android-package.txt
          sha256sum Sauna-Stilo-3.1.0-Android.apk >smoke-results/android-sha256.txt
      - name: Commit only tested application source without changing workflows
        run: |
          git add -- android lib web test tests tools firestore.rules pubspec.yaml OPERATIONS_RELEASE.md
          git rm .maintenance/ops.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: task assignments warehouse custody offline workspaces and private team games'
          git push origin HEAD:refs/heads/feat/operations-offline-play-20260906
          git rev-parse HEAD >smoke-results/tested-source.txt
          git archive HEAD >source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-check
          path: smoke-results
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: operations-source
          path: source.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: operations-android
          path: Sauna-Stilo-3.1.0-Android.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: operations-web
          path: build/web
          retention-days: 3
