name: Verify final task and warehouse release
on:
  push:
    branches: [fix/general-tasks-warehouse-20260906]
permissions:
  contents: write
concurrency:
  group: final-task-warehouse-source
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded reviewed source edits
        run: |
          python3 .maintenance/finalize-task-warehouse.py
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
            if name.startswith('lib/screens/') and name.endswith('.dart'):
              p=Path(name)
              p.write_text(''.join(line.rstrip()+'\n' if 'static const Color' in line else line for line in p.read_text().splitlines(keepends=True)))
          PY
          git diff --check
          mkdir -p smoke-results
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and regression policies
        run: |
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/app.js')"
          node --test tests/*.test.cjs | tee smoke-results/node-tests.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify task scopes custody history and games in isolated emulators
        run: |
          npm install --prefix /tmp/sauna-rules --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing
          NODE_PATH=/tmp/sauna-rules/node_modules /tmp/sauna-rules/node_modules/.bin/firebase emulators:exec --project demo-sauna-team --only firestore,storage 'NODE_PATH=/tmp/sauna-rules/node_modules node --test tools/security.test.cjs tools/people-security.test.cjs tools/social-security.test.cjs tools/operations-security.test.cjs tools/general-task-security.test.cjs' | tee smoke-results/security-tests.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze all application source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings >smoke-results/analyzer.txt 2>&1
      - name: Verify role navigation general task option and warehouse layout
        run: flutter test test/release_navigation_test.dart test/team_workflows_test.dart test/people_release_test.dart test/social_audio_test.dart test/operations_release_test.dart test/task_creation_test.dart | tee smoke-results/flutter-tests.txt
      - name: Build branded web with offline shell
        run: |
          flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
          node tools/prepare-offline.cjs
      - name: Verify browser startup actual AI audio and offline form
        run: |
          npm install --prefix /tmp/sauna-browser --no-audit --no-fund playwright
          python3 -m http.server 8177 --directory build/web >/tmp/sauna-http.log 2>&1 &
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/team-browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/people-browser-check.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/social-audio-browser.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/offline-browser-check.cjs
      - name: Build Android for internal testing
        run: |
          flutter build apk --release --build-name=3.1.1 --build-number=$(date +%s) >smoke-results/android-build.txt 2>&1
          cp build/app/outputs/flutter-apk/app-release.apk Sauna-Stilo-3.1.1-Android.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGNER="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --verbose --print-certs Sauna-Stilo-3.1.1-Android.apk >smoke-results/android-signature.txt
          sha256sum Sauna-Stilo-3.1.1-Android.apk >smoke-results/android-sha256.txt
      - name: Preserve only verified source
        run: |
          git add -- lib test tools pubspec.lock OPERATIONS_RELEASE.md
          git rm .maintenance/finalize-task-warehouse.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: assign daily tasks without a project and unify warehouse registration'
          git push origin HEAD:fix/general-tasks-warehouse-20260906
          git rev-parse HEAD >smoke-results/tested-source.txt
          git archive HEAD >source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-operations-check
          path: smoke-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: final-operations-source
          path: source.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Sauna-Stilo-3.1.1-Android
          path: Sauna-Stilo-3.1.1-Android.apk
          retention-days: 30
