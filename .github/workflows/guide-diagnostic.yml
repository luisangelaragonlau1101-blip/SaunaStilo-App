name: Guide diagnostic
on:
  push:
    branches: [fix/team-final-reviewed-20260905]
    paths: [.github/workflows/guide-diagnostic.yml]
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public guide transport without private data
        run: |
          npm install --prefix /tmp/guide --no-audit --no-fund playwright
          mkdir -p guide-report
          NODE_PATH=/tmp/guide/node_modules node <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const report={http:[],console:[],failures:[]};
            for(const method of ['OPTIONS','POST']){
              try{
                const r=await fetch('https://api-v2.appdeploy.ai/app/ollin-smart-vxs23c/api/chat',{method,headers:{Origin:'https://ollin-smart-vxs23c.v2.appdeploy.ai','Content-Type':'application/json',...(method==='OPTIONS'?{'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}:{})},...(method==='POST'?{body:JSON.stringify({workspace:'sauna-stilo',messages:[{role:'user',content:'Explica cómo encontrar mis tareas.'}]})}:{}),signal:AbortSignal.timeout(45000)});
                report.http.push({method,status:r.status,headers:Object.fromEntries([...r.headers].filter(([k])=>k.startsWith('access-control')||k==='content-type')),body:(await r.text()).slice(0,3500)});
              }catch(e){report.http.push({method,error:e.message})}
            }
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.on('console',m=>{if(m.type()==='error')report.console.push(m.text())});page.on('requestfailed',r=>report.failures.push({url:r.url().split('?')[0],failure:r.failure()}));
            await page.goto('https://ollin-smart-vxs23c.v2.appdeploy.ai/?workspace=sauna-stilo',{waitUntil:'domcontentloaded'});
            await page.getByLabel('Pregunta a Online Smart').fill('¿Cómo encuentro mis tareas en Sauna Stilo?');await page.getByRole('button',{name:'Enviar pregunta',exact:true}).click();
            await page.locator('.sg-bubble.assistant,.sg-error').first().waitFor({timeout:52000});report.text=await page.locator('body').innerText();
            await page.screenshot({path:'guide-report/guide.png'});await browser.close();fs.writeFileSync('guide-report/results.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-diagnostic
          path: guide-report
          retention-days: 1
