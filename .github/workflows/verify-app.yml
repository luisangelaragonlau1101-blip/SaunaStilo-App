name: Verify application
on:
  push:
    branches: [feat/futuristic-shell-voice-guide]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: source.tar
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend and run regressions
        run: |
          node --check functions/index.js
          node --check functions/app.js
          node --check functions/assistant-policy.js
          node --check functions/assistant-v2.js
          node --check functions/voice-service.js
          node --check functions/push-payload.js
          node --test tests/*.test.cjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile futuristic web application
        run: flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
      - name: Record exact tested source
        run: git rev-parse HEAD > build/web/reviewed-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-futuristic-web
          path: build/web
          retention-days: 3
