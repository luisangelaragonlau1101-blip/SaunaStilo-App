name: Verify application
on:
  push:
    branches: [fix/2026-09-push-ai, feat/stilo-experience-20260905]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact public source for reproducible review
        run: git archive --format=zip HEAD -o source-review.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: source-review.zip
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend and run connectivity regressions
        run: |
          for file in functions/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile the updated application
        run: flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
      - name: Record the exact tested source
        run: git rev-parse HEAD > build/web/reviewed-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web
          path: build/web
          retention-days: 3
