name: Verify application
on:
  push:
    branches: [fix/2026-09-push-ai]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend and run connectivity regressions
        run: |
          node --check functions/index.js
          node --check functions/assistant-policy.js
          node --check functions/push-payload.js
          node --test tests/*.test.cjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile the updated application
        run: flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
      - name: Record the exact tested source
        run: git rev-parse HEAD > build/web/reviewed-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web
          path: build/web
          retention-days: 3
