name: Current source snapshot
on:
  push:
    branches: [fix/intro-online-smart]
    paths: [.github/workflows/current-source.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: concurrent-source
          path: source.tar
          retention-days: 1
