name: Finalize staff release without changing its signing identity
on:
  push:
    branches: [feat/staff-workflows-36]
    paths: ['.github/workflows/staff36-finish.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    uses: ./.github/workflows/team-release-review.yml
  android-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical source and packaging inputs
        run: git diff --exit-code 8b6671c24b144ceb6ed3b68abd2b1f5077b93148 HEAD -- lib android assets web pubspec.yaml pubspec.lock .maintenance
      - name: Wait for the previously started Android compilation and emulator result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/luisangelaragonlau1101-blip/SaunaStilo-App/actions/runs/34172871558/jobs?filter=latest'
          for attempt in range(40):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r: jobs=json.load(r)['jobs']
              job=next(j for j in jobs if j['name']=='android')
              if job['status']=='completed':
                  assert job['conclusion']=='success','Android build or emulator did not pass'
                  print('Identical Android payload and emulator check passed in run 34172871558.')
                  break
              time.sleep(15)
          else: raise SystemExit('Android payload is not ready; no release was preserved.')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: staff36-unsigned-android
          run-id: 34172871558
          github-token: ${{ github.token }}
          path: payload
      - name: Recheck unsigned payload integrity and provenance
        run: |
          sha256sum --check payload/sha256.txt
          test "$(cat payload/source-commit.txt)" = '8b6671c24b144ceb6ed3b68abd2b1f5077b93148'
          unzip -t payload/sauna-3.6.0-unsigned.apk >/dev/null
          test -s payload/pid.txt
          if grep -q 'FATAL EXCEPTION' payload/runtime.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: staff36-unsigned-android
          path: payload
          retention-days: 3
  preserve:
    needs: [verify, android-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit only source that passed the workflow and Android proof
        run: |
          python3 .maintenance/apply36.py
          git diff --check
          git add lib test tests tools pubspec.yaml STAFF36_RELEASE.md
          git rm .maintenance/staff36.*.bin .maintenance/apply36.py .maintenance/package36.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: controlled staff tasks, lunch, administrative inbox and engineering'
          git push origin HEAD:feat/staff-workflows-36
          git archive HEAD > source.tar
          git rev-parse HEAD > tested-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: staff36-verified-source
          path: |
            source.tar
            tested-source.txt
          retention-days: 3
