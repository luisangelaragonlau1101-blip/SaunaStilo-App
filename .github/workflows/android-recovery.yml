name: Repair Android installation without deleting legacy data
on:
  push:
    branches: [fix/android-installation-351]
    paths: ['tools/android-recovery/**', '.github/workflows/android-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: Sauna-Stilo-3.5.0-Android
          run-id: 34157148079
          github-token: ${{ github.token }}
          path: legacy
      - name: Install encryption library
        run: python3 -m pip install --quiet cryptography
      - name: Create aligned side-by-side APK and encrypted owner signing backup
        run: python3 tools/android-recovery/sign.py
      - name: Verify Android manifest package and component mapping
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging recovery-output/Sauna-Stilo-3.5.1-Android.apk > recovery-report/badging.txt
          grep "package: name='com.saunastilo.personal'" recovery-report/badging.txt
          grep "launchable-activity: name='com.saunastylo.saunastylo.MainActivity'" recovery-report/badging.txt
      - name: Enable KVM for isolated install test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 tools/android-recovery/device-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-recovery-report
          path: recovery-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sauna-Stilo-3.5.1-Android-recovery
          path: recovery-output
          if-no-files-found: error
          retention-days: 30
