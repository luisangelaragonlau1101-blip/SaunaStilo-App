name: Inspect public service transport
on:
  push:
    branches: [qa/company34-transport]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/browser --no-audit --no-fund playwright
      - run: NODE_PATH=/tmp/browser/node_modules node tools/company-transport-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-transport-report
          path: transport-report.json
          retention-days: 1
