name: Verify operations 37 without publishing partial services
on:
  push:
    branches: [fix/operations-37]
    paths: ['.maintenance/**', '.github/workflows/operations37-check.yml', 'tools/panels37-security.test.cjs']
permissions:
  contents: read
concurrency:
  group: operations37-review
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 .maintenance/apply37.py
          git diff --check
          mkdir -p checks37
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test attendance notices and original server behavior
        run: |
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/app.js')"
          node --test tests/*.test.cjs tools/online-smart34/*.test.mjs | tee checks37/node.txt
          bash -n tools/activate-team-services.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify administrator-only panel selection in isolated Firestore
        run: |
          npm install --prefix /tmp/stilo-rules --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing
          NODE_PATH=/tmp/stilo-rules/node_modules /tmp/stilo-rules/node_modules/.bin/firebase emulators:exec --project demo-sauna-team --only firestore 'NODE_PATH=/tmp/stilo-rules/node_modules node --test tools/panels37-security.test.cjs' | tee checks37/security.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Analyze all application code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings > checks37/analyzer.txt 2>&1
      - name: Test new panels navigation and completion with existing workflows
        run: flutter test test/release_navigation_test.dart test/team_workflows_test.dart test/people_release_test.dart test/social_audio_test.dart test/operations_release_test.dart test/task_creation_test.dart test/party_games_test.dart test/academy_arcade_test.dart test/company34_test.dart test/personal35_test.dart test/staff36_test.dart test/operations37_test.dart | tee checks37/flutter.txt
      - name: Compile web without publishing it or changing Android signing
        run: |
          flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none > checks37/build.txt 2>&1
          node tools/prepare-offline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations37-checks
          path: checks37
          retention-days: 7
  preserve:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve readable verified source on the review branch only
        run: |
          python3 .maintenance/apply37.py
          git diff --check
          git add lib functions test tests tools OPERATIONS37_STATUS.md OPERATIONS37_DIAGNOSTICS.json
          git rm .maintenance/ops37.*.bin .maintenance/apply37.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: consolidate warehouse, select staff panels and prepare attendance notices'
          git push origin HEAD:fix/operations-37
          git archive HEAD > source.tar
          git rev-parse HEAD > tested-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: operations37-verified-source
          path: |
            source.tar
            tested-source.txt
          retention-days: 7
