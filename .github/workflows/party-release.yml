name: Verify Pausa Stilo release
on:
  push:
    branches: [feat/pausa-stilo-four-players]
permissions:
  contents: read
concurrency:
  group: pausa-stilo-preparation
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    uses: ./.github/workflows/team-release-review.yml
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require byte-identical application sources to the signature-verified Android build
        run: |
          git diff --exit-code 5958a5755614355c1c1b66df6ff8e5ea49fcf495 HEAD -- lib android assets web pubspec.yaml pubspec.lock .maintenance/finish-party.py
          mkdir -p android-report
          echo 'Android package built and signature verified in run 34062186439, source 5958a5755614355c1c1b66df6ff8e5ea49fcf495. Application inputs are unchanged; only tests and delivery workflows changed.' >android-report/provenance.txt
      - uses: actions/download-artifact@v4
        with:
          name: Sauna-Stilo-3.2.0-Android
          run-id: 34062186439
          github-token: ${{ github.token }}
      - name: Verify exact previously signed APK bytes and ZIP integrity
        run: |
          echo '62618c9c9cdb42e87c962eaf2778af923e740f5c0e3007c81d459c562d142a05  Sauna-Stilo-3.2.0-Android.apk' | sha256sum --check
          unzip -t Sauna-Stilo-3.2.0-Android.apk >android-report/integrity.txt
          sha256sum Sauna-Stilo-3.2.0-Android.apk >android-report/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sauna-Stilo-3.2.0-Android
          path: Sauna-Stilo-3.2.0-Android.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-android-report
          path: android-report
          retention-days: 7
  preserve:
    needs: [verify, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve only the integration verified by both jobs
        run: |
          python3 .maintenance/finish-party.py
          git diff --check
          git add -- lib/main.dart lib/screens/login_screen.dart lib/screens/team_games_screen.dart lib/services/app_action_catalog.dart pubspec.yaml
          git rm .maintenance/finish-party.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect four-player offline games while preserving team operations'
          git push origin HEAD:feat/pausa-stilo-four-players
          git archive HEAD > source.tar
          git rev-parse HEAD > tested-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: party-verified-source
          path: |
            source.tar
            tested-source.txt
          retention-days: 3
