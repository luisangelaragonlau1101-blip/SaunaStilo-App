name: Build Android APK with retained signing identity
# Deliberate release only: ordinary web commits must not mint incompatible Android APKs.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAUNA_SIGNING_STORE: ${{ runner.temp }}/sauna-signing.p12
      SAUNA_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SAUNA_SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require protected owner-managed signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          required=['KEYSTORE_BASE64','SAUNA_SIGNING_PASSWORD','SAUNA_SIGNING_ALIAS','EXPECTED_CERT_SHA256']
          if any(not os.environ.get(k) for k in required):
              raise SystemExit('Signing is not configured. Do not create another debug-signed release. Configure protected secrets with the appropriate existing key first.')
          p=pathlib.Path(os.environ['SAUNA_SIGNING_STORE'])
          p.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True));p.chmod(0o600)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - name: Verify identity before distributing
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > signature.txt
          python3 - <<'PY'
          import os,pathlib,re
          s=pathlib.Path('signature.txt').read_text()
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',s).group(1)
          expected=os.environ['EXPECTED_CERT_SHA256'].replace(':','').lower().strip()
          if actual!=expected: raise SystemExit('Unexpected signing certificate: refusing to distribute this APK.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SaunaStilo-Android-retained-signature
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material from runner
        if: always()
        run: rm -f "$SAUNA_SIGNING_STORE"
