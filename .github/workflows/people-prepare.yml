name: Preserve verified people source
on:
  push:
    branches: [feat/people-release-20260905]
    paths:
      - '.maintenance/people-plan-*.json'
      - 'tools/apply-people-release.py'
      - '.github/workflows/people-prepare.yml'
permissions:
  contents: write
concurrency:
  group: people-release-prepare
  cancel-in-progress: true
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the exact source tested in run 33998385572
        run: python3 tools/apply-people-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck syntax and regression policies
        run: |
          for file in functions/*.js web/voice-capture.js tools/people-*.cjs; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Commit application source only, leaving workflow files unchanged
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm .maintenance/people-plan-*.json tools/apply-people-release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: team badges, birthday lists, private justifications and normal-speed voice'
          git push origin HEAD:refs/heads/feat/people-release-20260905
      - name: Preserve exact source for final pull-request verification
        run: |
          mkdir -p source-report
          git rev-parse HEAD > source-report/source-sha.txt
          git archive HEAD > source-report/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: people-verified-source
          path: source-report
          retention-days: 1
