name: Verify social and audio release
on:
  push:
    branches: [feat/social-rounded-profiles-20260906]
permissions:
  contents: write
concurrency:
  group: social-audio-prepare
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply only checksum-verified reviewed source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root=Path.cwd().resolve()
          names=['social.part0','social.b','social.c','social.d']
          encoded=''.join((root/'.maintenance'/name).read_text().strip() for name in names)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='52feab803d0a24f322f95684b18ccd40d46a010c09c29e9e8c5c5a56c36fb48b','Manifest checksum mismatch'
          outputs={}
          for entry in json.loads(raw):
              name=entry['path']; path=(root/name).resolve()
              assert path.is_relative_to(root) and '.git' not in path.parts and '.github' not in path.parts and name not in outputs
              before=path.read_bytes() if path.exists() else b''
              actual=hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest() if path.exists() else None
              assert actual==entry['base'],f'Base changed: {name}'
              lines=before.decode().splitlines(keepends=True); previous=len(lines)+1
              for start,end,text in reversed(entry['ops']):
                  assert 0<=start<=end<=len(lines) and end<=previous,f'Invalid range: {name}'
                  lines[start:end]=text.splitlines(keepends=True); previous=start
              after=''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest()==entry['sha256'],f'Final checksum mismatch: {name}'
              outputs[name]=after
          for name,after in outputs.items():
              path=root/name; path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(after)
          print('Verified and applied',len(outputs),'application files; no production data changed.')
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend and browser source
        run: |
          for file in functions/*.js web/chat-audio-capture.js tools/social-*.cjs; do node --check "$file"; done
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/app.js')"
          node --test tests/*.test.cjs
          bash -n tools/activate-voice-service.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify chat audio, profiles and notes in isolated emulators
        run: |
          npm install --prefix /tmp/sauna-rules --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing
          NODE_PATH=/tmp/sauna-rules/node_modules /tmp/sauna-rules/node_modules/.bin/firebase emulators:exec --project demo-sauna-team --only firestore,storage 'NODE_PATH=/tmp/sauna-rules/node_modules node --test tools/security.test.cjs tools/people-security.test.cjs tools/social-security.test.cjs'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify role navigation and social forms
        run: flutter test test/release_navigation_test.dart test/team_workflows_test.dart test/people_release_test.dart test/social_audio_test.dart
      - name: Compile branded web app
        run: flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
      - name: Verify app, real guide, audio capture and playback
        run: |
          npm install --prefix /tmp/sauna-browser --no-audit --no-fund playwright
          python3 -m http.server 8177 --directory build/web >/tmp/sauna-http.log 2>&1 &
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/team-browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/people-browser-check.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/social-audio-browser.cjs
      - name: Commit only successfully verified app source on this branch
        run: |
          git add -- functions lib web test tests tools SOCIAL_AUDIO_RELEASE.md
          git rm -- .maintenance/social.part0 .maintenance/social.part1 .maintenance/social.b .maintenance/social.c .maintenance/social.d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: rounded social profiles, admin supervision and reliable audio messages'
          git push origin HEAD:refs/heads/feat/social-rounded-profiles-20260906
          git rev-parse HEAD > build/web/reviewed-source-sha.txt
          git archive HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-audio-browser
          path: smoke-results
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: social-audio-source
          path: source.tar
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: social-audio-web
          path: build/web
          retention-days: 3
