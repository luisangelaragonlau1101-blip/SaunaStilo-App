name: Team workflow review
on:
  push:
    branches: [fix/intro-online-smart]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: team-review-source
          path: source.tar
          retention-days: 1
