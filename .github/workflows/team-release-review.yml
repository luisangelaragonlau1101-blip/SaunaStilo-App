name: Team workflow review
on:
  push:
    branches: [fix/intro-online-smart]
permissions:
  contents: read
concurrency:
  group: team-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply the reviewed patch only on its maintenance branch
        if: github.ref == 'refs/heads/fix/intro-online-smart'
        run: |
          if [ -f .maintenance/team.part0 ]; then
            cat .maintenance/team.part0 .maintenance/team.part1 .maintenance/team.part2 | base64 --decode | gzip --decompress > /tmp/team.patch
            echo '77ccf5612f2a81a634ee51bae63caa25c6f9fc2d05dfa64cb8fae908aab2abc4  /tmp/team.patch' | sha256sum --check
            # Keep the separately-added guide screen with its manual and reload controls.
            test "$(git hash-object lib/screens/online_smart_screen.dart)" = '09bf740532c9f87d9769d06a6001648274f8c640'
            git apply --exclude=lib/screens/online_smart_screen.dart --check /tmp/team.patch
            git apply --exclude=lib/screens/online_smart_screen.dart /tmp/team.patch
            git diff --check
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate notification policies and backend source
        run: |
          for file in functions/*.js; do node --check "$file"; done
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/app.js')"
          node --test tests/*.test.cjs
          bash -n tools/activate-services.sh
      - name: Test master and project permissions in an isolated emulator
        run: |
          npm install --prefix /tmp/sauna-rules --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing
          NODE_PATH=/tmp/sauna-rules/node_modules /tmp/sauna-rules/node_modules/.bin/firebase emulators:exec --project demo-sauna-team --only firestore 'NODE_PATH=/tmp/sauna-rules/node_modules node --test tools/security.test.cjs'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify every role and the preserved general alert
        run: flutter test test/release_navigation_test.dart test/team_workflows_test.dart
      - name: Compile the existing application
        run: flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
      - name: Verify browser startup and actual Online Smart answer
        run: |
          npm install --prefix /tmp/sauna-browser --no-audit --no-fund playwright
          python3 -m http.server 8177 --directory build/web >/tmp/sauna-http.log 2>&1 &
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/team-browser-smoke.cjs
      - name: Commit the patch only after all checks pass
        if: github.ref == 'refs/heads/fix/intro-online-smart'
        run: |
          if [ -f .maintenance/team.part0 ]; then
            git add -- functions lib tests test tools firestore.rules
            git rm -- .maintenance/team.part0 .maintenance/team.part1 .maintenance/team.part2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: team home, personal alerts, private project chat and scoped master tasks'
            git push origin HEAD:fix/intro-online-smart
          fi
      - name: Preserve the exact verified source
        run: |
          git rev-parse HEAD > build/web/reviewed-source-sha.txt
          git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-workflow-browser
          path: smoke-results
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: team-verified-web
          path: build/web
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: team-review-source
          path: source.tar
          retention-days: 1
