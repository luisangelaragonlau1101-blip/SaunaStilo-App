name: Team workflow review
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce pending reviewed source when present
        run: |
          if [ -f .maintenance/apply-company34.py ]; then python3 .maintenance/apply-company34.py; fi
          git diff --check
          mkdir -p smoke-results
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, privacy and regression policies
        run: |
          for file in functions/*.js web/*offline*.js web/privacy-controls.js tools/*browser*.cjs; do node --check "$file"; done
          npm --prefix functions ci --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/app.js')"
          node --test tests/*.test.cjs tools/online-smart34/service.test.mjs | tee smoke-results/node-tests.txt
          bash -n tools/activate-team-services.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing role and custody permissions in isolated emulators
        run: |
          npm install --prefix /tmp/sauna-rules --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing
          NODE_PATH=/tmp/sauna-rules/node_modules /tmp/sauna-rules/node_modules/.bin/firebase emulators:exec --project demo-sauna-team --only firestore,storage 'NODE_PATH=/tmp/sauna-rules/node_modules node --test --test-concurrency=1 tools/security.test.cjs tools/people-security.test.cjs tools/social-security.test.cjs tools/operations-security.test.cjs tools/general-task-security.test.cjs' | tee smoke-results/security-tests.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze all application source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings >smoke-results/analyzer.txt 2>&1
      - name: Verify roles, approvals, manual publication, sources and certificates
        run: flutter test test/release_navigation_test.dart test/team_workflows_test.dart test/people_release_test.dart test/social_audio_test.dart test/operations_release_test.dart test/task_creation_test.dart test/party_games_test.dart test/academy_arcade_test.dart test/company34_test.dart | tee smoke-results/flutter-tests.txt
      - name: Compile night-branded application and public offline resources
        run: |
          flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
          node tools/prepare-offline.cjs
      - name: Verify existing UI, real guide, audio and offline games
        run: |
          npm install --prefix /tmp/sauna-browser --no-audit --no-fund playwright
          python3 -m http.server 8177 --directory build/web >/tmp/sauna-http.log 2>&1 &
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules SAUNA_URL=http://127.0.0.1:8177/ node tools/team-browser-smoke.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/people-browser-check.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/social-audio-browser.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/offline-browser-check.cjs
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/party-browser-check.cjs
      - name: Check removed guest study and private API rejection without employee data
        run: NODE_PATH=/tmp/sauna-browser/node_modules node tools/company34-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-workflow-browser
          path: smoke-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: team-verified-web
          path: build/web
          retention-days: 3
