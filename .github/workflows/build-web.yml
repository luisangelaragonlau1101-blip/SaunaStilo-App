name: Build Web App
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify existing work roles and offline games
        run: |
          node --test tests/*.test.cjs
          flutter test test/release_navigation_test.dart test/team_workflows_test.dart test/people_release_test.dart test/social_audio_test.dart test/operations_release_test.dart test/task_creation_test.dart test/party_games_test.dart
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Compile and version the exact release
        run: |
          flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none
          VERSION="${GITHUB_SHA::8}"
          cp build/web/main.dart.js "build/web/main.${VERSION}.dart.js"
          cp build/web/flutter_bootstrap.js "build/web/flutter_bootstrap.${VERSION}.js"
          sed -i "s/main.dart.js/main.${VERSION}.dart.js/g" "build/web/flutter_bootstrap.${VERSION}.js"
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.${VERSION}.js/g" build/web/index.html
          sed -i "s/__SAUNA_BUILD_VERSION__/${VERSION}/g" build/web/index.html
          node -e "require('fs').writeFileSync('build/web/version.json', JSON.stringify({release:'3.2.0',commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}))"
          cp web/reset.html build/web/reset.html
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js
          node tools/prepare-offline.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        with:
          preview: false
      - name: Verify existing public URL and offline-worker revision
        run: |
          mkdir -p smoke-results
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const report={expectedCommit:process.env.GITHUB_SHA,sites:[]};
            for(const base of ['https://sauna-stilo-app-web.vercel.app/','https://luisangelaragonlau1101-blip.github.io/SaunaStilo-App/']){
              let site={base,current:false};
              for(let i=0;i<6;i++){
                try{
                  const r=await fetch(base+'version.json?check='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(15000)});
                  const v=r.ok?await r.json():{};
                  const w=await fetch(base+'stilo-offline-worker.js?check='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(15000)});
                  const source=w.ok?await w.text():'';
                  site={base,httpStatus:r.status,release:v.release,commit:v.commit,current:v.commit===process.env.GITHUB_SHA,offlineWorkerCurrent:source.includes(process.env.GITHUB_SHA)};
                  if(site.current&&site.offlineWorkerCurrent)break;
                }catch(e){site.error=e.name;}
                await new Promise(resolve=>setTimeout(resolve,10000));
              }
              report.sites.push(site);
            }
            fs.writeFileSync('smoke-results/deployment-status.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
            if(!report.sites.every(s=>s.current&&s.offlineWorkerCurrent))process.exitCode=1;
          })().catch(e=>{console.error(e.name);process.exitCode=1;});
          NODE
      - name: Verify public startup without staff credentials or data writes
        run: |
          npm install --prefix /tmp/sauna-browser --no-audit --no-fund playwright
          NODE_PATH=/tmp/sauna-browser/node_modules node tools/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-read-only-check
          path: smoke-results
          retention-days: 7
