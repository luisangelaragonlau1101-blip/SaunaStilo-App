name: Build Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build web application
        run: flutter build web --release --base-href /SaunaStilo-App/ --pwa-strategy=none

      - name: Version web assets
        run: |
          VERSION="${GITHUB_SHA::8}"
          cp build/web/main.dart.js "build/web/main.${VERSION}.dart.js"
          cp build/web/flutter_bootstrap.js "build/web/flutter_bootstrap.${VERSION}.js"
          sed -i "s/main.dart.js/main.${VERSION}.dart.js/g" "build/web/flutter_bootstrap.${VERSION}.js"
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.${VERSION}.js/g" build/web/index.html

      - name: Add cache reset page
        run: cp web/reset.html build/web/reset.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: false
