name: Operations 37 source and read-only diagnostics
on:
  push:
    branches: [fix/operations-37]
    paths: [.github/workflows/operations37-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Export source and check public transport without authenticated mutations
        run: |
          git archive HEAD > source.tar
          git rev-parse HEAD > source-commit.txt
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const report=[];
            for(const name of ['updateAttendance','sendTeamAlert']){
              const url='https://us-central1-saunastiloapp-17e15.cloudfunctions.net/'+name;
              try {const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{}}),signal:AbortSignal.timeout(15000)});report.push({name,status:r.status,body:(await r.text()).slice(0,400)});}catch(e){report.push({name,error:e.name});}
            }
            fs.writeFileSync('diagnostics.json',JSON.stringify({checkedAt:new Date().toISOString(),unauthenticated:true,report},null,2));
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: operations37-source
          path: |
            source.tar
            source-commit.txt
            diagnostics.json
          retention-days: 3
