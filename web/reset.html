<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/SaunaStilo-App/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Abriendo Sauna Stilo</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; text-align: center; }
    .mark { color: #d6a85f; font-size: 58px; }
    h1 { margin: 12px 0; letter-spacing: 3px; font-size: 23px; }
    p { color: #c9c5be; }
  </style>
</head>
<body>
  <main><div class="mark">♨</div><h1>SAUNA STILO</h1><p>Abriendo la aplicación…</p></main>
  <script>
    // Retiramos registros antiguos sin bloquear el arranque ni borrar todos
    // los archivos descargados cada vez que se abre este enlace.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (items) {
        items.forEach(function (item) { item.unregister(); });
      }).catch(function () {});
    }
    setTimeout(function () {
      location.replace('./?v=' + Date.now());
    }, 250);
  </script>
</body>
</html>
