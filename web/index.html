<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    if (location.pathname === '/') document.querySelector('base').setAttribute('href', '/');
  </script>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de proyectos y equipo Sauna Stilo.">
  <meta name="theme-color" content="#050505">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sauna Stilo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Sauna Stilo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #050505; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #sauna-boot { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #050505; padding: 28px; box-sizing: border-box; }
    .sauna-logo { width: min(210px, 58vw); max-height: 190px; object-fit: contain; filter: drop-shadow(0 0 28px rgba(142,21,56,.24)); animation: sauna-breathe 1.8s ease-in-out infinite alternate; }
    #sauna-error { display: none; position: fixed; left: 20px; right: 20px; bottom: 34px; color: #fff; text-align: center; font-size: 13px; }
    #sauna-retry { display: none; margin: 14px auto 0; border: 1px solid rgba(183,255,42,.55); border-radius: 999px; background: #111012; color: #b7ff2a; padding: 11px 20px; font: inherit; font-weight: 800; cursor: pointer; }
    @keyframes sauna-breathe { from { opacity: .76; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
  </style>
  <script src="chat-audio-capture.js?v=social-audio-1"></script>
  <script src="voice-capture.js?v=people-20260905"></script>
</head>
<body>
  <div id="sauna-boot" role="status" aria-label="Abriendo Sauna Stilo">
    <img class="sauna-logo" src="assets/assets/logo_saunastilo.png" alt="Sauna Stilo">
  </div>
  <div id="sauna-error"><span id="sauna-status"></span><button id="sauna-retry" type="button" onclick="location.reload()">Reintentar</button></div>
  <noscript>Necesitas activar JavaScript para usar Sauna Stilo.</noscript>
  <script src="sauna-maintenance.js"></script>
  <script>
    (function () {
      var version = '__SAUNA_BUILD_VERSION__';
      var key = 'sauna-stilo-build-version';
      try { if (localStorage.getItem(key) === version) return; } catch (_) {}
      SaunaMaintenance.repair(document.baseURI)
        .then(function () { try { localStorage.setItem(key, version); } catch (_) {} })
        .catch(function () {});
    }());
  </script>
  <script>
    (function () {
      var boot = document.getElementById('sauna-boot');
      var errorBox = document.getElementById('sauna-error');
      var status = document.getElementById('sauna-status');
      var retry = document.getElementById('sauna-retry');
      var finished = false;
      function showHelp(message) {
        if (finished) return;
        status.textContent = message || 'No se pudo abrir Sauna Stilo.';
        errorBox.style.display = 'block';
        retry.style.display = 'block';
      }
      window.addEventListener('flutter-first-frame', function () {
        finished = true;
        if (boot) boot.remove();
        if (errorBox) errorBox.remove();
      });
      window.addEventListener('error', function () { showHelp('No se pudo cargar Sauna Stilo. Revisa tu conexión.'); });
      window.addEventListener('unhandledrejection', function () { showHelp('No se pudo iniciar Sauna Stilo.'); });
      setTimeout(function () { showHelp('La red está tardando más de lo normal.'); }, 30000);
    }());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
